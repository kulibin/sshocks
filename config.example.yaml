# sshocks — пример конфигурации
# Скопируйте этот файл в `config.yaml`, заполните значения и запустите:
#   go run ./cmd/sshocks --config config.yaml
#
# БЕЗОПАСНОСТЬ: пароль и приватный ключ в конфиге хранятся в открытом виде.
# Обязательно ограничьте права: `chmod 600 config.yaml`.

ssh:
  # Хост удалённого SSH-сервера (обязателен).
  host: 1.2.3.4
  # Порт SSH-сервера (дефолт: 22).
  port: 22
  # Имя пользователя SSH (обязательно).
  user: alice
  # Пароль SSH. Если задан — имеет приоровитет над приватным ключом
  # (осознанный выбор автора; см. README, раздел «Риски»).
  password: ""
  # Путь к приватному ключу (опц., используется если password пуст).
  # Поддерживается `~` (домашний каталог). Пример: ~/.ssh/id_ed25519
  key: ""
  # passphrase для приватного ключа (опц.).
  key_passphrase: ""
  # Таймаут установки SSH-соединения и dial-а через туннель.
  timeout: 30s

socks:
  # Листен-адрес SOCKS5-сервера. По умолчанию только локальные клиенты.
  listen: 127.0.0.1:1080

log:
  # Путь к файлу лога.
  file: ./sshocks.log
  # Уровень логирования: debug | info | warn | error
  level: info

# Grace drain активных SOCKS5-сессий перед форс-закрытием.
drain_timeout: 5s
