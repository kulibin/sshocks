# Локальный SSH-сервер и целевой эхо-сервер для smoke-теста.
#
# sshd слушает 127.0.0.1:2222 (host-side). Внутри контейнера запускается
# эхо-сервер на 0.0.0.0:8080, к которому туннель sshocks будет прокидывать
# трафик: `ssh -N -L`-подобный forward через ssh.Client.Dial.
services:
  sshd:
    image: alpine:3.20
    container_name: sshocks-smoke-sshd
    hostname: smoke-host
    ports:
       - "127.0.0.1:2222:22"
    # Запуск: sshd и простой эхо-сервер на порту 8080 внутри контейнера.
    command:
       - sh
       - -c
       - |
        set -e

         # Пользователь smoke с известным паролем.
        adduser -D -H -G users -s /bin/sh smoke || true
        echo "smoke:smoke" | chpasswd

         # Host-key для sshd.
        mkdir -p /run/sshd /var/run/sshd
        ssh-keygen -A

         # Простой эхо-сервер: принимает строку и возвращает её.
        # (nc -le требует netcat; используем python3 из образа или busybox nc.)
        if command -v nc >/dev/null 2>&1; then
          sh -c 'while true; do nc -l 8080 -p 8080 -e /bin/cat; done' &
        else
          # Fallback: busybox nc.
          sh -c 'while true; do nc -l 0.0.0.0 8080 -c /bin/cat; done' &
        fi

         # В фоне sshd.
        /usr/sbin/sshd -D -e &
        wait
